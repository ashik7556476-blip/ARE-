<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | 『 𝐌𝐊 』 𝐓𝐑𝐀𝐃𝐈𝐍𝐆 𝐙𝐎𝐍𝐄</title>
  <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
  <style>body{min-height:100vh;display:grid;place-items:center;background:#071426;color:#eef4ff;padding:20px}.login-card{width:min(100%,420px);padding:30px;border:1px solid #29415f;border-radius:18px;background:#10213a;box-shadow:0 18px 50px #0006}.brand{text-align:center;font-weight:800;font-size:1.35rem;margin-bottom:24px}.form-control{min-height:48px}.btn{min-height:48px;width:100%;font-weight:700}</style>
</head>
<body>
  <main class="login-card">
    <div class="brand">『 𝐌𝐊 』 𝐓𝐑𝐀𝐃𝐈𝐍𝐆 𝐙𝐎𝐍𝐄</div>
    <h2 class="h4 text-center mb-4">Enter Password</h2>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
  </main>
</body>
</html>
